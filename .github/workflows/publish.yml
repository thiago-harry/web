name: Publish to GitHub Pages branch

# GitHub Pages serves /docs from the pitch branch. On every push to main this
# workflow rebuilds the MVP, copies it and app/ into that branch and pushes.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

env:
  SITE_BRANCH: claude/funny-edison-whtbw7

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SITE_BRANCH }}
          path: site

      - name: Copy MVP and app into the site branch
        run: |
          set -euo pipefail
          for d in docs/mvp public/mvp; do
            rm -rf "site/$d"; mkdir -p "site/$d"; cp -r dist/. "site/$d/"
          done
          for d in docs/app public/app; do
            rm -rf "site/$d"; mkdir -p "site/$d"; cp -r app/index.html app/src app/packs "site/$d/"
          done

      - name: Commit and push
        id: push
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/mvp public/mvp docs/app public/app
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "Publish from main ${GITHUB_SHA::7}"
          git push origin "HEAD:${SITE_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a Pages build
        if: steps.push.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
